<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management | E-Commerce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .page-title {
            color: #1f3c88;
            font-weight: 700;
        }

        .card {
            border: 0;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .table thead th {
            background: #1f3c88;
            color: white;
        }

        .empty-state {
            padding: 35px;
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">E-Commerce System</a>
        <span class="navbar-text text-white">Admin Dashboard</span>
    </div>
</nav>

<main class="container py-5">
    <div class="mb-4">
        <h1 class="page-title">Category Management</h1>
        <p class="text-muted mb-0">Create, update, view, and deactivate product categories.</p>
    </div>

    <div id="messageBox"></div>

    <div class="card mb-4">
        <div class="card-body p-4">
            <h4 id="formTitle" class="mb-3">Add New Category</h4>

            <form id="categoryForm">
                <input type="hidden" id="categoryId">

                <div class="row g-3">
                    <div class="col-md-5">
                        <label for="categoryName" class="form-label">Category Name</label>
                        <input type="text" id="categoryName" class="form-control" required maxlength="100">
                    </div>

                    <div class="col-md-5">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" id="description" class="form-control" maxlength="300">
                    </div>

                    <div class="col-md-2 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary w-100">Save</button>
                        <button type="button" id="cancelButton" class="btn btn-outline-secondary d-none">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header bg-white py-3">
            <h4 class="mb-0">Category Dashboard</h4>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Category Name</th>
                    <th>Description</th>
                    <th>Products</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody id="categoryTableBody">
                <tr>
                    <td colspan="6" class="empty-state">Loading categories...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
    const apiUrl = "/api/categories";
    const categoryForm = document.getElementById("categoryForm");
    const categoryIdInput = document.getElementById("categoryId");
    const categoryNameInput = document.getElementById("categoryName");
    const descriptionInput = document.getElementById("description");
    const categoryTableBody = document.getElementById("categoryTableBody");
    const formTitle = document.getElementById("formTitle");
    const cancelButton = document.getElementById("cancelButton");
    const messageBox = document.getElementById("messageBox");

    async function loadCategories() {
        try {
            const response = await fetch(apiUrl);
            const categories = await response.json();

            if (categories.length === 0) {
                categoryTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-state">No categories found. Add your first category above.</td>
                    </tr>`;
                return;
            }

            categoryTableBody.innerHTML = categories.map(category => `
                <tr>
                    <td>${category.categoryId}</td>
                    <td>${category.categoryName}</td>
                    <td>${category.description || "-"}</td>
                    <td>${category.productCount ?? 0}</td>
                    <td>
                        <span class="badge ${category.status ? "bg-success" : "bg-secondary"}">
                            ${category.status ? "Active" : "Inactive"}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1"
                                onclick="editCategory(${category.categoryId}, '${escapeText(category.categoryName)}', '${escapeText(category.description || "")}')">
                            Edit
                        </button>
                        ${category.status ? `
                            <button class="btn btn-sm btn-outline-danger"
                                    onclick="deactivateCategory(${category.categoryId}, ${category.productCount ?? 0})">
                                Deactivate
                            </button>` : ""}
                    </td>
                </tr>
            `).join("");
        } catch (error) {
            showMessage("Could not load categories. Please check that the application is running.", "danger");
        }
    }

    categoryForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const category = {
            categoryName: categoryNameInput.value.trim(),
            description: descriptionInput.value.trim()
        };

        const id = categoryIdInput.value;
        const method = id ? "PUT" : "POST";
        const url = id ? `${apiUrl}/${id}` : apiUrl;

        try {
            const response = await fetch(url, {
                method: method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(category)
            });

            if (!response.ok) {
                throw new Error();
            }

            showMessage(id ? "Category updated successfully." : "Category created successfully.", "success");
            resetForm();
            loadCategories();
        } catch (error) {
            showMessage("Could not save the category.", "danger");
        }
    });

    function editCategory(id, name, description) {
        categoryIdInput.value = id;
        categoryNameInput.value = name;
        descriptionInput.value = description;
        formTitle.textContent = "Update Category";
        cancelButton.classList.remove("d-none");
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function deactivateCategory(id, productCount) {
        let warning = "Are you sure you want to deactivate this category?";

        if (productCount > 0) {
            warning = `This category has ${productCount} product(s). Assign products to another category before deactivating it.`;
        }

        if (!confirm(warning)) {
            return;
        }

        if (productCount > 0) {
            showMessage("Please assign the products to another category first.", "warning");
            return;
        }

        try {
            const response = await fetch(`${apiUrl}/${id}`, { method: "DELETE" });

            if (!response.ok) {
                throw new Error();
            }

            showMessage("Category deactivated successfully.", "success");
            loadCategories();
        } catch (error) {
            showMessage("Could not deactivate the category.", "danger");
        }
    }

    function resetForm() {
        categoryForm.reset();
        categoryIdInput.value = "";
        formTitle.textContent = "Add New Category";
        cancelButton.classList.add("d-none");
    }

    function showMessage(message, type) {
        messageBox.innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
    }

    function escapeText(value) {
        return String(value).replace(/'/g, "\\'");
    }

    cancelButton.addEventListener("click", resetForm);

    loadCategories();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
